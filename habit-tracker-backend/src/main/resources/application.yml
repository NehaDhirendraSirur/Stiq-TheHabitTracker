spring:
  application:
    name: habit-tracker

  datasource:
    url: jdbc:postgresql://localhost:5432/habit_tracker
    username: postgres
    password: YOUR_DB_PASSWORD
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: UTC

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui
